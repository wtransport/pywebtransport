# PyWebTransport CI/CD Pipeline

stages:
  - lint
  - test
  - delivery

default:
  tags:
    - wtransport

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  DEBIAN_FRONTEND: "noninteractive"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_COLOR: "1"
  PIP_ROOT_USER_ACTION: "ignore"

lint:
  stage: lint
  image: python:3.14-slim-trixie
  cache:
    key: "$CI_JOB_NAME_SLUG"
    paths:
      - .cache/pip
      - .cargo/registry
      - crates/target/
  needs: []
  dependencies: []
  before_script:
    - cp "$INTERNAL_CA_CERT" /usr/local/share/ca-certificates/internal_ca.crt
    - update-ca-certificates
    - sed -i -e "s|http://deb.debian.org/debian-security|$APT_SECURITY_PROXY_URL|g" -e "s|http://deb.debian.org/debian|$APT_PROXY_URL|g" /etc/apt/sources.list.d/debian.sources
    - apt-get update && apt-get install -y curl build-essential clang
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.93.1
    - export PATH="$CARGO_HOME/bin:$PATH"
    - python -m pip install --upgrade pip
    - pip install -r dev-requirements.txt
  script:
    - isort --check-only src tests
    - black --check src tests
    - cargo fmt --manifest-path crates/Cargo.toml -- --check
    - flake8 src tests
    - mypy src tests
    - cargo clippy --manifest-path crates/Cargo.toml -- -D warnings
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'
    - when: never

test:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.12", "3.13", "3.14"]
  image: python:$PYTHON_VERSION-slim-trixie
  cache:
    key: "$CI_JOB_NAME_SLUG"
    paths:
      - .cache/pip
      - .cargo/registry
      - crates/target/
  needs:
    - lint
  dependencies: []
  before_script:
    - cp "$INTERNAL_CA_CERT" /usr/local/share/ca-certificates/internal_ca.crt
    - update-ca-certificates
    - sed -i -e "s|http://deb.debian.org/debian-security|$APT_SECURITY_PROXY_URL|g" -e "s|http://deb.debian.org/debian|$APT_PROXY_URL|g" /etc/apt/sources.list.d/debian.sources
    - apt-get update && apt-get install -y curl build-essential clang
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.93.1
    - export PATH="$CARGO_HOME/bin:$PATH"
    - python -m pip install --upgrade pip
    - pip install -r dev-requirements.txt
    - pip install -e .
  script:
    - cargo test --manifest-path crates/Cargo.toml
    - pytest --cov=pywebtransport --cov-report=term
  coverage: '/TOTAL.*\s+(\d+%)$/'
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'
    - when: never

delivery:
  stage: delivery
  image: python:3.14-slim-trixie
  variables:
    GIT_DEPTH: 0
  cache: []
  needs:
    - lint
    - test
  dependencies: []
  before_script:
    - cp "$INTERNAL_CA_CERT" /usr/local/share/ca-certificates/internal_ca.crt
    - update-ca-certificates
    - sed -i -e "s|http://deb.debian.org/debian-security|$APT_SECURITY_PROXY_URL|g" -e "s|http://deb.debian.org/debian|$APT_PROXY_URL|g" /etc/apt/sources.list.d/debian.sources
    - apt-get update && apt-get install -y git gnupg
    - export GPG_TTY=$(tty)
    - gpg --batch --import "$GITHUB_GPG_PRIVATE_KEY"
    - 'git config user.signingkey $(gpg --list-secret-keys --with-colons | grep "^sec:" | cut -d: -f5 | head -n1)'
    - git config commit.gpgsign true
    - git config user.name "WTransport Bot"
    - git config user.email "251935624+wtransport-bot@users.noreply.github.com"
  script:
    - VERSION=$(python -c "import tomllib; print(tomllib.load(open('crates/Cargo.toml', 'rb'))['package']['version'])")
    - REMOTE_TAGS=$(git ls-remote --tags "https://$GITHUB_TOKEN@github.com/wtransport/pywebtransport.git") || exit 1
    - |
      if echo "$REMOTE_TAGS" | grep -q "refs/tags/v$VERSION"; then
        git push "https://$GITHUB_TOKEN@github.com/wtransport/pywebtransport.git" $CI_COMMIT_SHA:refs/heads/$CI_COMMIT_BRANCH
        exit 0
      fi
    - git tag -s -m "Release v$VERSION" "v$VERSION"
    - git push "https://oauth2:$GITLAB_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git" "v$VERSION"
    - git push "https://$GITHUB_TOKEN@github.com/wtransport/pywebtransport.git" $CI_COMMIT_SHA:refs/heads/$CI_COMMIT_BRANCH
    - git push "https://$GITHUB_TOKEN@github.com/wtransport/pywebtransport.git" "v$VERSION"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never
