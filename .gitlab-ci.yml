# PyWebTransport CI/CD Pipeline

stages:
  - lint
  - test
  - build
  - deploy

default:
  tags:
    - wtransport

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_COLOR: "1"
  IMAGE_NAME: ghcr.io/wtransport/interop-server

cache:
  paths:
    - .cache/pip
    - .cargo/registry
    - .cargo/git
    - target/

lint:
  stage: lint
  image: python:3.12-slim-bookworm
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r dev-requirements.txt
  script:
    - black --check src tests
    - flake8 src tests
    - mypy src tests
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'
    - when: never

test:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.12", "3.13"]
  image: python:$PYTHON_VERSION-slim-bookworm
  before_script:
    - apt-get update && apt-get install -y curl build-essential clang
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.93.0
    - export PATH="$HOME/.cargo/bin:$PATH"
    - python -m pip install --upgrade pip
    - pip install -r dev-requirements.txt
    - pip install -e .
  script:
    - cargo test --manifest-path crates/Cargo.toml
    - pytest --cov=pywebtransport --cov-report=term
  coverage: '/TOTAL.*\s+(\d+%)$/'
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'
    - when: never

build:
  stage: build
  image: python:3.12-slim-bookworm
  variables:
    GIT_DEPTH: 0
  before_script:
    - apt-get update && apt-get install -y curl build-essential clang
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.93.0
    - export PATH="$HOME/.cargo/bin:$PATH"
    - python -m pip install --upgrade pip
    - pip install maturin
  script:
    - maturin build --release --strip --out dist
    - maturin sdist --out dist
    - echo "VERSION=$(python -c "import tomllib; print(tomllib.load(open('crates/Cargo.toml', 'rb'))['package']['version'])")" >> build.env
    - echo "Built version $(python -c "import tomllib; print(tomllib.load(open('crates/Cargo.toml', 'rb'))['package']['version'])")"
    - ls -la dist/
  artifacts:
    paths:
      - dist/
    reports:
      dotenv: build.env
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

deploy-release:
  stage: deploy
  image: python:3.12-slim-bookworm
  variables:
    GIT_DEPTH: 0
  dependencies:
    - build
  before_script:
    - apt-get update && apt-get install -y ca-certificates git gnupg
    - cp "$INTERNAL_CA_CERT" /usr/local/share/ca-certificates/internal_ca.crt
    - update-ca-certificates
    - export GPG_TTY=$(tty)
    - gpg --batch --import "$GPG_PRIVATE_KEY"
    - 'git config user.signingkey $(gpg --list-secret-keys --with-colons | grep "^sec:" | cut -d: -f5 | head -n1)'
    - git config commit.gpgsign true
    - python -m pip install --upgrade pip
    - pip install maturin
  script:
    - |
      if git ls-remote --tags origin | grep -q "refs/tags/v$VERSION"; then
        echo "Version v$VERSION already released - skipping"
        exit 0
      fi
    - maturin upload dist/* --username "$MATURIN_USERNAME" --password "$MATURIN_PASSWORD" --non-interactive
    - git config user.name "WTransport Bot"
    - git config user.email "251935624+wtransport-bot@users.noreply.github.com"
    - git tag -s -m "Release v$VERSION" "v$VERSION"
    - git push "https://oauth2:$GITLAB_DEPLOY_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git" "v$VERSION"
    - git push "https://$GITHUB_TOKEN@github.com/wtransport/pywebtransport.git" $CI_COMMIT_SHA:refs/heads/$CI_COMMIT_BRANCH
    - git push "https://$GITHUB_TOKEN@github.com/wtransport/pywebtransport.git" --tags
  environment:
    name: production
    url: https://pypi.org/project/pywebtransport/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

deploy-image:
  stage: deploy
  image: docker:29.1
  services:
    - docker:29.1-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
  dependencies:
    - build
  before_script:
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
  script:
    - ls -la dist/
    - docker build -t $IMAGE_NAME:$VERSION -t $IMAGE_NAME:latest -f examples/interop/Dockerfile .
    - docker push $IMAGE_NAME:$VERSION
    - docker push $IMAGE_NAME:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never
