# PyWebTransport CI/CD Pipeline

stages:
  - lint
  - test
  - build
  - deploy

default:
  tags:
    - wtransport

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_COLOR: "1"
  PIP_ROOT_USER_ACTION: "ignore"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  IMAGE_NAME: ghcr.io/wtransport/interop-server

lint:
  stage: lint
  image: python:3.12-slim-bookworm
  cache:
    paths:
      - .cache/pip
      - .cargo/registry
      - crates/target/
  before_script:
    - apt-get update && apt-get install -y curl build-essential clang
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.93.1
    - export PATH="$CARGO_HOME/bin:$PATH"
    - python -m pip install --upgrade pip
    - pip install -r dev-requirements.txt
  script:
    - isort --check-only src tests
    - black --check src tests
    - cargo fmt --manifest-path crates/Cargo.toml -- --check
    - flake8 src tests
    - mypy src tests
    - cargo clippy --manifest-path crates/Cargo.toml -- -D warnings
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'
    - when: never

test:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.12", "3.13", "3.14"]
  image: python:$PYTHON_VERSION-slim-bookworm
  cache:
    paths:
      - .cache/pip
      - .cargo/registry
      - crates/target/
  before_script:
    - apt-get update && apt-get install -y curl build-essential clang
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.93.1
    - export PATH="$CARGO_HOME/bin:$PATH"
    - python -m pip install --upgrade pip
    - pip install -r dev-requirements.txt
    - pip install -e .
  script:
    - cargo test --manifest-path crates/Cargo.toml
    - pytest --cov=pywebtransport --cov-report=term
  coverage: '/TOTAL.*\s+(\d+%)$/'
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'
    - when: never

build:
  stage: build
  image: python:3.12-slim-bookworm
  variables:
    GIT_DEPTH: 0
  cache:
    paths:
      - .cache/pip
      - .cargo/registry
      - crates/target/
  before_script:
    - apt-get update && apt-get install -y curl build-essential clang
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.93.1
    - export PATH="$CARGO_HOME/bin:$PATH"
    - python -m pip install --upgrade pip
    - pip install maturin
  script:
    - maturin build --release --strip --out dist --manifest-path crates/Cargo.toml
    - maturin sdist --out dist --manifest-path crates/Cargo.toml
    - echo "VERSION=$(python -c "import tomllib; print(tomllib.load(open('crates/Cargo.toml', 'rb'))['package']['version'])")" >> build.env
    - echo "Built version $(python -c "import tomllib; print(tomllib.load(open('crates/Cargo.toml', 'rb'))['package']['version'])")"
    - ls -la dist/
  artifacts:
    paths:
      - dist/
    reports:
      dotenv: build.env
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

deploy-release:
  stage: deploy
  image: python:3.12-slim-bookworm
  variables:
    GIT_DEPTH: 0
  cache: []
  dependencies:
    - build
  before_script:
    - apt-get update && apt-get install -y ca-certificates git gnupg
    - cp "$INTERNAL_CA_CERT" /usr/local/share/ca-certificates/internal_ca.crt
    - update-ca-certificates
    - export GPG_TTY=$(tty)
    - gpg --batch --import "$GPG_PRIVATE_KEY"
    - 'git config user.signingkey $(gpg --list-secret-keys --with-colons | grep "^sec:" | cut -d: -f5 | head -n1)'
    - git config commit.gpgsign true
    - python -m pip install --upgrade pip
    - pip install twine
  script:
    - REMOTE_TAGS=$(git ls-remote --tags origin) || exit 1
    - |
      if echo "$REMOTE_TAGS" | grep -q "refs/tags/v$VERSION"; then
        echo "Version v$VERSION already released - skipping"
        exit 0
      fi
    - twine check dist/*
    - twine upload dist/* -u "$TWINE_USERNAME" -p "$TWINE_PASSWORD" --non-interactive
    - git config user.name "WTransport Bot"
    - git config user.email "251935624+wtransport-bot@users.noreply.github.com"
    - git tag -s -m "Release v$VERSION" "v$VERSION"
    - git push "https://oauth2:$GITLAB_DEPLOY_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git" "v$VERSION"
    - git push "https://$GITHUB_TOKEN@github.com/wtransport/pywebtransport.git" $CI_COMMIT_SHA:refs/heads/$CI_COMMIT_BRANCH
    - git push "https://$GITHUB_TOKEN@github.com/wtransport/pywebtransport.git" --tags
  environment:
    name: production
    url: https://pypi.org/project/pywebtransport/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

deploy-image:
  stage: deploy
  image: docker:29.1
  services:
    - docker:29.1-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
  cache: []
  dependencies:
    - build
  before_script:
    - apk add --no-cache ca-certificates git
    - cp "$INTERNAL_CA_CERT" /usr/local/share/ca-certificates/internal_ca.crt
    - update-ca-certificates
    - git config --global http.sslCAInfo /etc/ssl/certs/ca-certificates.crt
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
  script:
    - ls -la dist/
    - REMOTE_TAGS=$(git ls-remote --tags origin) || exit 1
    - |
      if echo "$REMOTE_TAGS" | grep -q "refs/tags/v$VERSION"; then
        echo "Version v$VERSION already released - skipping Docker push to prevent overwriting immutable tags"
        exit 0
      fi
    - docker build -t $IMAGE_NAME:$VERSION -t $IMAGE_NAME:latest -f examples/interop/Dockerfile .
    - docker push $IMAGE_NAME:$VERSION
    - docker push $IMAGE_NAME:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never
