# PyWebTransport GitHub CI

name: CI

on:
  push:
    branches: [main, "dry-run/*"]
    tags: ["v*"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  id-token: write
  packages: write

env:
  CARGO_HOME: ${{ github.workspace }}/.cargo
  DEBIAN_FRONTEND: "noninteractive"
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_COLOR: "1"
  PIP_ROOT_USER_ACTION: "ignore"

jobs:
  lint:
    runs-on: ubuntu-26.04
    container:
      image: python:3.14-slim-trixie
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup cache
        uses: actions/cache@v6
        with:
          path: |
            .cache/pip
            .cargo/registry
            crates/target/
          key: ${{ runner.os }}-lint-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('dev-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-lint-

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y curl build-essential clang

      - name: Install rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.97.1
          echo "$CARGO_HOME/bin" >> $GITHUB_PATH

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dev-requirements.txt

      - name: Run linters
        run: |
          isort --check-only src tests
          black --check src tests
          cargo fmt --manifest-path crates/Cargo.toml -- --check
          flake8 src tests
          mypy src tests
          cargo clippy --manifest-path crates/Cargo.toml -- -D warnings

  audit:
    needs: lint
    runs-on: ubuntu-26.04
    container:
      image: python:3.14-slim-trixie
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup cache
        uses: actions/cache@v6
        with:
          path: |
            .cache/pip
            .cargo/registry
          key: ${{ runner.os }}-audit-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('dev-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-audit-

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y curl git

      - name: Install rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.97.1
          echo "$CARGO_HOME/bin" >> $GITHUB_PATH

      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          curl -fsSL https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.9/cargo-deny-0.19.9-x86_64-unknown-linux-musl.tar.gz | tar xz --wildcards --strip-components=1 -C /usr/local/bin '*/cargo-deny'

      - name: Run audit
        run: |
          cargo deny --manifest-path crates/Cargo.toml check
          pip-audit -r dev-requirements.txt

  test:
    needs: audit
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15-rc"]
    container:
      image: python:${{ matrix.python-version }}-slim-trixie
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup cache
        uses: actions/cache@v6
        with:
          path: |
            .cache/pip
            .cargo/registry
            crates/target/
          key: ${{ runner.os }}-test-${{ matrix.python-version }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('dev-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ matrix.python-version }}-

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y curl build-essential clang

      - name: Install rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.97.1
          echo "$CARGO_HOME/bin" >> $GITHUB_PATH

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dev-requirements.txt
          pip install -e .

      - name: Test rust
        run: |
          cargo test --manifest-path crates/Cargo.toml

      - name: Test python
        run: |
          pytest --cov=pywebtransport --cov-report=xml:coverage-${{ matrix.python-version }}.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports-${{ matrix.python-version }}
          path: coverage-*.xml

  report:
    needs: test
    runs-on: ubuntu-26.04
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download coverage
        uses: actions/download-artifact@v8
        with:
          path: coverage-reports/

      - name: Publish coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: wtransport/pywebtransport
          directory: ./coverage-reports/

  build-sdist:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/dry-run/')
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/Cargo.toml

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist/*.tar.gz

  build-wheels:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/dry-run/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: universal2-apple-darwin
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
          - os: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --strip --out dist --manifest-path crates/Cargo.toml --target ${{ matrix.target }}
          container: off

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  publish-image:
    needs: [build-sdist, build-wheels]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          path: dist/
          name: wheels-ubuntu-26.04

      - name: Extract version
        id: extract_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Login ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: examples/interop/Dockerfile
          push: true
          tags: |
            ghcr.io/wtransport/interop-server:${{ steps.extract_version.outputs.version }}
            ghcr.io/wtransport/interop-server:latest
          provenance: false

  publish-package:
    needs: publish-image
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/project/pywebtransport/
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: wheels-*
          merge-multiple: true

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
