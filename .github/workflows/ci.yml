# PyWebTransport GitHub CI

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_COLOR: "1"
  PIP_ROOT_USER_ACTION: "ignore"
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
  CARGO_HOME: ${{ github.workspace }}/.cargo

jobs:
  lint:
    runs-on: ubuntu-24.04
    container:
      image: python:3.12-slim-bookworm
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: .cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('dev-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dev-requirements.txt
      - name: Code quality checks
        run: |
          black --check src tests
          flake8 src tests
          mypy src tests

  test:
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    container:
      image: python:${{ matrix.python-version }}-slim-bookworm
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            .cache/pip
            .cargo/registry
            crates/target/
          key: ${{ runner.os }}-cargo-test-${{ matrix.python-version }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('dev-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-${{ matrix.python-version }}-

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y curl build-essential clang

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.93.1
          echo "$CARGO_HOME/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dev-requirements.txt
          pip install -e .

      - name: Run Rust tests
        run: |
          cargo test --manifest-path crates/Cargo.toml

      - name: Run Python tests
        run: |
          pytest --cov=pywebtransport --cov-report=xml:coverage-${{ matrix.python-version }}.xml
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports-${{ matrix.python-version }}
          path: coverage-*.xml

  report:
    needs: test
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    container:
      image: python:3.12-slim-bookworm
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Download coverage reports
        uses: actions/download-artifact@v8
        with:
          path: coverage-reports/
      - name: Install Codecov dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl gpg
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: wtransport/pywebtransport
          directory: ./coverage-reports/
