# PyWebTransport Feature Proposal GitHub Issue Form

name: "Feature Proposal"
description: "Submit a technical enhancement proposal."
labels: ["enhancement", "triage"]
body:
  - type: "markdown"
    attributes:
      value: |
        Technical proposal for library enhancement.

  - type: "textarea"
    id: "motivation"
    attributes:
      label: "Motivation"
      description: "Contextual justification for the proposal."
    validations:
      required: true

  - type: "textarea"
    id: "design"
    attributes:
      label: "Design"
      description: "Architectural implementation details."
    validations:
      required: true

  - type: "textarea"
    id: "interface"
    attributes:
      label: "Interface"
      description: "Public API signatures and usage patterns."
    validations:
      required: true

  - type: "textarea"
    id: "alternatives"
    attributes:
      label: "Alternatives"
      description: "Discarded approaches and trade-offs."
    validations:
      required: false

  - type: "input"
    id: "reference"
    attributes:
      label: "References"
      description: "Citations of relevant IETF specifications."
      placeholder: "e.g., draft-ietf-webtrans-http3-15, Section 5.2"
    validations:
      required: false

  - type: "checkboxes"
    id: "checklist"
    attributes:
      label: "Checklist"
      options:
        - label: "Checked existing issues for duplicates."
          required: true
        - label: "Willing to submit a Pull Request."
          required: false
