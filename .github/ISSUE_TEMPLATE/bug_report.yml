# PyWebTransport Bug Report GitHub Issue Form

name: "Bug Report"
description: "File a technical defect report."
labels: ["bug", "triage"]
body:
  - type: "markdown"
    attributes:
      value: |
        Required details for defect diagnosis.

  - type: "input"
    id: "version"
    attributes:
      label: "Library Version"
      description: "Specific version identifier."
      placeholder: "e.g., 0.11.0"
    validations:
      required: true

  - type: "input"
    id: "python-version"
    attributes:
      label: "Python Runtime"
      description: "Interpreter version."
      placeholder: "e.g., 3.12.12"
    validations:
      required: true

  - type: "dropdown"
    id: "os"
    attributes:
      label: "Operating System"
      description: "Host platform environment."
      options:
        - "Linux"
        - "macOS"
        - "Windows"
      multiple: true
    validations:
      required: true

  - type: "dropdown"
    id: "network"
    attributes:
      label: "Network Topology"
      description: "Execution environment connectivity."
      options:
        - "Loopback"
        - "LAN"
        - "WAN"
        - "Container"
        - "CI"
      multiple: true
    validations:
      required: true

  - type: "textarea"
    id: "description"
    attributes:
      label: "Defect Summary"
      description: "Technical description of the anomaly."
    validations:
      required: true

  - type: "textarea"
    id: "reproduction"
    attributes:
      label: "Reproduction"
      description: "Minimal executable code snippet demonstrating the failure."
      placeholder: |
        ```python
        import asyncio
        from pywebtransport import WebTransportSession

        async def main():
            # Minimal reproduction logic
            pass

        if __name__ == "__main__":
            asyncio.run(main())
        ```
    validations:
      required: true

  - type: "textarea"
    id: "comparison"
    attributes:
      label: "Expected vs Actual"
      description: "Contrast expected protocol behavior with observed results."
      placeholder: |
        Expected: Stream closes with error code 0x0.
        Actual: Connection timeout after 500ms.
    validations:
      required: true

  - type: "textarea"
    id: "logs"
    attributes:
      label: "Diagnostics"
      description: "Tracebacks or debug logs."
      render: "shell"

  - type: "checkboxes"
    id: "verification"
    attributes:
      label: "Verification"
      options:
        - label: "Checked existing issues for duplicates."
          required: true
        - label: "Tested against the latest stable release."
          required: false
