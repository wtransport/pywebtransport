[package]
name = "pywebtransport-engine"
version = "0.20.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96.1"
publish = false
build = "build.rs"

[lib]
name = "_pywebtransport"
crate-type = ["cdylib"]

[dependencies]
bytes = "1.12.1"
crossbeam-queue = "0.3.13"
pyo3 = { version = "0.29.0", features = ["abi3-py312", "extension-module"] }
quinn-proto = "0.11.16"
rcgen = "0.14.8"
rustc-hash = "2.1.3"
rustls = { version = "0.23.42", default-features = false, features = [
    "ring",
    "std",
] }
rustls-native-certs = "0.8.4"
thiserror = "2.0.18"
time = "0.3.53"
tokio = { version = "1.52.3", features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki-roots = "1.0.8"

[build-dependencies]
bindgen = "0.72.1"
cc = "1.2.67"

[dev-dependencies]
rstest = "0.26.1"

[lints.rust]
absolute_paths_not_starting_with_crate = "warn"
explicit_outlives_requirements = "warn"
ffi_unwind_calls = "deny"
impl_trait_redundant_captures = "warn"
let_underscore_drop = "deny"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
missing_unsafe_on_extern = "warn"
non_ascii_idents = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unreachable_pub = "warn"
unsafe_attr_outside_unsafe = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_crate_dependencies = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
default_trait_access = "allow"
implicit_hasher = "allow"
inline_always = "allow"
map_unwrap_or = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
naive_bytecount = "allow"
self_only_used_in_recursion = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
verbose_bit_mask = "allow"

allow_attributes_without_reason = "warn"
as_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
create_dir = "warn"
dbg_macro = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
expect_used = "warn"
filetype_is_file = "warn"
fn_to_numeric_cast_any = "warn"
get_unwrap = "warn"
host_endian_bytes = "warn"
indexing_slicing = "warn"
infinite_loop = "warn"
iter_over_hash_type = "warn"
let_underscore_must_use = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
missing_assert_message = "warn"
mixed_read_write_in_expression = "warn"
multiple_inherent_impl = "warn"
mutex_atomic = "warn"
panic = "warn"
panic_in_result_fn = "warn"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
str_to_string = "warn"
string_add = "warn"
string_slice = "warn"
tests_outside_test_module = "warn"
todo = "warn"
try_err = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
verbose_file_reads = "warn"
