# PyWebTransport Read the Docs Configuration

version: 2

build:
  os: "ubuntu-26.04"
  apt_packages:
    - build-essential
    - clang
    - pkg-config
  tools:
    python: "3.14"
  jobs:
    post_create_environment:
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.97.1
    install:
      - export PATH="$HOME/.cargo/bin:$PATH" && python -m pip install --upgrade --no-cache-dir pip setuptools
      - export PATH="$HOME/.cargo/bin:$PATH" && python -m pip install --upgrade --no-cache-dir .[docs]

mkdocs:
  configuration: mkdocs.yml
